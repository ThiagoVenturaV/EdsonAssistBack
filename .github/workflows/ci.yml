name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest pip-audit
      - run: python -m compileall -q .
      - run: JWT_SECRET=test-secret-with-at-least-thirty-two-characters python -m pytest -q
      - run: python -m pip_audit -r requirements.txt
      - name: Verify required JWT secret
        run: |
          if python -c "import auth.service"; then
            echo "Import unexpectedly succeeded without JWT_SECRET"
            exit 1
          fi
